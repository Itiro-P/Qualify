info:
  contact: {}
  description: Sim.
  title: Qualify API
  version: "1.0"
paths:
  /analysts:
    get:
      consumes:
      - application/json
      description: Retorna uma lista de analistas com filtros opcionais
      parameters:
      - description: Nome parcial para busca
        in: query
        name: name
        type: string
      - description: País
        in: query
        name: country
        type: string
      - description: Cidade
        in: query
        name: city
        type: string
      - description: Valor mínimo por hora
        in: query
        name: min_hourly_rate
        type: number
      - description: Valor máximo por hora
        in: query
        name: max_hourly_rate
        type: number
      - description: Quantidade mínima de avaliações totais
        in: query
        name: min_total_reviews
        type: integer
      - description: Avaliação média mínima
        in: query
        name: min_mean_rating
        type: number
      - description: 'Campo para ordenar: name,country_name,city,hourly_rate,total_reviews,mean_rating,time_created'
        in: query
        name: sort_by
        type: string
      - description: 'Direção: ASC ou DESC'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.AnalystsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar analistas
      tags:
      - Analistas
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Permite que usuário autenticado altere sua senha com validação.
        Requer token de acesso válido
      parameters:
      - description: 'Enviar confirmação por email (padrão: true)'
        in: query
        name: send_email
        type: boolean
      - description: Senha atual e nova senha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg.PasswordChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Senha alterada com sucesso
          schema:
            $ref: '#/definitions/pkg.PasswordChangeResponse'
        "400":
          description: Requisição inválida ou senha fraca
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Senha atual inválida
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      - Bearer: []
      summary: Alterar senha do usuário
      tags:
      - Autenticação
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica usuário com email e senha, retornando tokens JWT de acesso
        e refresh.
      parameters:
      - description: Email do usuário
        in: query
        name: email
        type: string
      - description: Senha do usuário
        in: query
        name: password
        type: string
      - description: Objeto login
        in: body
        name: analyst
        required: true
        schema:
          $ref: '#/definitions/pkg.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: Autenticado com sucesso e tokens retornados
          schema:
            $ref: '#/definitions/pkg.LoginResponse'
        "400":
          description: Entrada inválida ou erro de validação
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Credenciais inválidas
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "429":
          description: Muitas tentativas de login
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Login de usuário com geração de JWT
      tags:
      - Autenticação
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revoga todos os refresh tokens do usuário autenticado, efetivamente desconectando todas as sessões ativas. Se um refresh_token específico for fornecido como query parameter, apenas aquele token será revogado (logout do dispositivo atual). Caso contrário, todos os tokens do usuário são revogados (logout global).

        **Comportamentos:**
        - Sem parâmetro: Revoga TODOS os refresh tokens (logout de todos os dispositivos)
        - Com refresh_token: Revoga APENAS aquele token específico (logout do dispositivo atual)
      parameters:
      - description: Refresh token específico para revogar (opcional). Se não fornecido,
          revoga todos os tokens do usuário
        in: query
        name: refresh_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Logout realizado com sucesso
          schema:
            $ref: '#/definitions/pkg.SuccessResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Não autorizado - Token inválido ou expirado
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      - Bearer: []
      summary: Logout e invalidação de tokens
      tags:
      - Autenticação
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Obtém um novo token de acesso usando um refresh token válido.
      parameters:
      - description: Refresh token
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Novo token de acesso gerado
          schema:
            $ref: '#/definitions/pkg.TokenResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "401":
          description: Refresh token inválido ou expirado
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar token de acesso
      tags:
      - Autenticação
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Inicia o processo de redefinição de senha enviando link por email
      parameters:
      - description: Endereço de email do usuário
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email de redefinição enviado
          schema:
            $ref: '#/definitions/pkg.SuccessResponse'
        "400":
          description: Email inválido
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "404":
          description: Usuário não encontrado
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Solicitar redefinição de senha
      tags:
      - Autenticação
  /auth/reset-password/confirm:
    post:
      consumes:
      - application/json
      description: Define nova senha usando token de redefinição enviado por email
      parameters:
      - description: Token de redefinição de senha
        in: query
        name: token
        required: true
        type: string
      - description: Nova senha (mínimo 8 caracteres, com letras maiúsculas, minúsculas,
          números e símbolos)
        in: query
        name: new_password
        required: true
        type: string
      - description: 'Enviar confirmação por email (padrão: true)'
        in: query
        name: send_email
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Redefinição de senha bem-sucedida
          schema:
            $ref: '#/definitions/pkg.SuccessResponse'
        "400":
          description: Token inválido ou senha fraca
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirmar redefinição de senha com token
      tags:
      - Autenticação
  /certifications:
    get:
      consumes:
      - application/json
      description: Retorna lista de certificações
      parameters:
      - description: Nome parcial
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.CertificationsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar certificações
      tags:
      - Certificações
    post:
      consumes:
      - application/json
      description: Cria uma nova certificação
      parameters:
      - description: Objeto certificação
        in: body
        name: certification
        required: true
        schema:
          $ref: '#/definitions/pkg.Certification'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/pkg.CertificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Criar certificação
      tags:
      - Certificações
  /certifications/{id}:
    delete:
      consumes:
      - application/json
      description: Exclui certificação pelo ID
      parameters:
      - description: ID da certificação
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Excluir certificação
      tags:
      - Certificações
    get:
      consumes:
      - application/json
      description: Retorna certificação por ID
      parameters:
      - description: ID da certificação
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.CertificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter certificação
      tags:
      - Certificações
    patch:
      consumes:
      - application/json
      description: Atualiza um ou mais campos da certificação pelo ID
      parameters:
      - description: ID da certificação
        in: path
        name: id
        required: true
        type: integer
      - description: Objeto certificação
        in: body
        name: certification
        required: true
        schema:
          $ref: '#/definitions/pkg.CertificationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.CertificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar certificação parcialmente
      tags:
      - Certificações
    put:
      consumes:
      - application/json
      description: Atualiza uma certificação pelo ID
      parameters:
      - description: ID da certificação
        in: path
        name: id
        required: true
        type: integer
      - description: Objeto certificação
        in: body
        name: certification
        required: true
        schema:
          $ref: '#/definitions/pkg.Certification'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.CertificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar certificação
      tags:
      - Certificações
  /clients:
    get:
      consumes:
      - application/json
      description: Retorna uma lista de clientes com filtros opcionais
